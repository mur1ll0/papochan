[package]
name = "papochan"
version = "1.1.0"
description = "PapoChan - Zero-Knowledge Real-Time Multi-Device Video Platform"
authors = ["PapoChan Team"]
edition = "2021"

[lib]
name = "papochan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
