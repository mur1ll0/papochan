# PapoChan TURN relay (coturn)
#
# Replace every REPLACE_ME below, then: docker compose up -d
# See deploy/coturn/README.md for the full walkthrough.

# --- Listening ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# Public IPv4 of this machine. On a cloud VM whose public address is NAT-mapped
# to a private NIC (AWS, Oracle Cloud, GCP), use the PUBLIC/PRIVATE form so
# coturn advertises the routable address:
#   external-ip=203.0.113.10/10.0.0.5
external-ip=REPLACE_ME_PUBLIC_IP

# Relay port range. Each active allocation consumes one port, so this caps
# concurrent relayed streams (~40 here). Widen for more traffic, and remember to
# open the same range in the firewall / cloud security group.
min-port=49160
max-port=49200

# --- Authentication ----------------------------------------------------------
# Ephemeral credentials (TURN REST API). The browser never sees this secret: the
# app mints username=<expiry>:<client> / credential=base64(HMAC-SHA1(secret,username))
# in /api/turn-credentials, and coturn recomputes the same HMAC to verify it.
#
# Must match TURN_SECRET in the Vercel environment variables, byte for byte.
use-auth-secret
static-auth-secret=REPLACE_ME_LONG_RANDOM_SECRET

# Any value works as long as it is stable; the domain name is conventional.
realm=REPLACE_ME_DOMAIN

# --- TLS ---------------------------------------------------------------------
# turns: on a TLS port is what gets through corporate firewalls that allow only
# HTTPS. Comment both lines out if you are testing without a certificate.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Modern ciphers only.
no-tlsv1
no-tlsv1_1

# --- Hardening ---------------------------------------------------------------
fingerprint
no-cli
no-multicast-peers

# Refuse to relay towards private and link-local ranges. Without this, an open
# relay can be used to probe the internal network of whoever hosts it.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Bandwidth guards. user-quota is per allocation, total-quota is server wide;
# both are in kilobits per second.
user-quota=3000
total-quota=60000

# --- Logging -----------------------------------------------------------------
log-file=stdout
simple-log
# Uncomment while debugging a connection, then turn it back off: verbose logging
# on a busy relay is a lot of output.
# verbose
